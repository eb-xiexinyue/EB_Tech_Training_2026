<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>自己紹介</title>
</head>
<body style="background-color: #3a4c66;    font-family: fantasy;">
　
<section style="display: block;position: relative;
      background-color: white;
      width: 50vw;
      height: 50vh;
      margin: 30px auto 0;
      padding: 20px 30px;
      border-radius: 23px;">
    <button onclick="
        const r = Math.floor(Math.random() * 256)
        const g = Math.floor(Math.random() * 256)
        const b = Math.floor(Math.random() * 256)
        document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b}`
        document.body.style.color = `rgb(${r}, ${g}, ${b}`
        " style="position: absolute;
        right: 20px;
        border-radius: 23px;
        border: 1px solid;
        background: #bdc4c4;">theme</button>
    <h1>WANG, Chaowei</h1>
    <h2>趣味</h2>
    <ul>
        <li>旅行</li>
        <li>映画</li>
        <li>ジョギング</li>
    </ul>
</section>
</body>
</html>
